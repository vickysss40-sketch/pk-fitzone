
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PK FITZONE Admin Login</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#090d09;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}
.login{
width:90%;
max-width:400px;
padding:35px;
background:#171d17;
border:1px solid #a4ef32;
border-radius:15px;
box-shadow:0 0 25px #a4ef3230;
}
h1{text-align:center;color:#a4ef32}
p{text-align:center;color:#aaa}
label{display:block;margin:18px 0 8px}
input{
width:100%;
padding:13px;
background:#090d09;
border:1px solid #444;
border-radius:7px;
color:white;
}
button{
width:100%;
padding:14px;
margin-top:25px;
background:#a4ef32;
border:0;
border-radius:7px;
font-weight:bold;
cursor:pointer;
}
#msg{color:#ff6868;font-size:14px}
</style>
</head>
<body>
<div class="login">
<h1>PK FITZONE</h1>
<p>ADMIN PANEL LOGIN</p>

<form id="loginForm">
<label>Username</label>
<input id="username" placeholder="Enter Username" required>

<label>Password</label>
<input id="password" type="password"
placeholder="Enter Password" required>

<button type="submit">LOGIN</button>
<p id="msg"></p>
</form>
</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit",function(e){
e.preventDefault();
document.getElementById("msg").textContent =
"Secure authentication setup is pending.";
});
</script>
</body>
</html>
